<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Needs Inventory</title>
<style>
:root{--p:#7a1f3d;--bg:#f5f6f8}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#222}
header{background:var(--p);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hbtn{background:#ffffff22;color:#fff;border:1px solid #ffffff77;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}.hbtn:hover{background:#ffffff38}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#ffffff22}.chip.bad{background:#ffd54f;color:#222}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;padding:8px 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
nav:empty{display:none}
nav button{border:0;background:#eee;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}nav button.on{background:var(--p);color:#fff}
main{padding:16px;max-width:1400px;margin:auto}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:10px;padding:14px;border-top:4px solid var(--p);box-shadow:0 1px 3px #0001;font-size:13px}.kpi b{display:block;font-size:24px;margin-top:6px}
.schools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.school{background:#fff;border:2px solid #e8d9df;border-radius:12px;padding:22px;cursor:pointer;text-align:start;font:inherit;color:#555;box-shadow:0 1px 3px #0001}
.school:hover,.school:focus-visible{border-color:var(--p)}
.school b{display:block;font-size:18px;color:var(--p);margin-bottom:8px}
.note{background:#fff8e1;border:1px solid #f0d58a;padding:10px 12px;border-radius:8px;margin:0 0 12px}
.warn{color:#9a3b00;font-size:13px}.muted{color:#666;font-size:13px}
form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:4px}
label.chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:#333}
input,select,textarea{font:inherit;padding:7px;border:1px solid #ccc;border-radius:6px;background:#fff;max-width:100%}
label.req span::after{content:" *";color:#c00}
.full{grid-column:1/-1}
.btn{background:var(--p);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit;display:inline-block}.btn.alt{background:#555}.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e2e2e2;padding:6px;text-align:start;vertical-align:top}th{background:#f0e6ea;position:sticky;top:0}
.wrap{overflow:auto;max-height:65vh}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select,.filters input{min-width:150px}
.dupbox{border:2px solid #f0d58a;border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf5}
.dup{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:10px}
.tag{font-size:12px;padding:3px 8px;border-radius:12px;background:#ffe0b2}.tag.red{background:#ffcdd2}
.impc{border:1px solid #e4d6dc;border-radius:10px;padding:12px;margin-bottom:12px}
select.st{padding:3px 4px;font-size:12px;min-width:110px}
.money{display:flex;gap:4px}.money input{flex:1;min-width:0}
.lnk{background:#f7f0f3;border:1px dashed #c9a9b6;border-radius:8px;padding:10px;margin-bottom:6px}.lnk input{flex:1;min-width:220px}
#toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 2px 8px #0003;z-index:20;display:none;max-width:90vw}
[dir=rtl] #toast{transform:translateX(50%)}
#toast.err{background:#b00020}
@media print{nav,header,.noprint,#toast{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
// ===== SETTINGS =====

const API_URL = "https://script.google.com/macros/s/AKfycbyEItECDo9tS40Ws6kQc_hNEtJTMr4pIN4GBGD_GEnM3yRIFa1nlYYk_FbKuSVnjTiwCw/exec";
const YEAR="2027/2028", KEY="qstss_needs", REMOTE=!!API_URL;
// 1 USD in QAR (the riyal is pegged to the dollar). Prices typed in USD are converted and saved in QAR.
const USD_RATE=3.64;

];
const L={
dept:["العلوم (عام) / Science (General)","العلوم – الأحياء / Biology","العلوم – الكيمياء / Chemistry","العلوم – الفيزياء / Physics","الرياضيات / Mathematics","اللغة الإنجليزية / English","اللغة العربية / Arabic","التربية الإسلامية / Islamic Studies","الدراسات الاجتماعية / Social Studies","الحوسبة وتكنولوجيا المعلومات / Computing & IT","الهندسة والتكنولوجيا / Engineering & Technology","التربية البدنية / Physical Education","الفنون البصرية / Visual Arts","مركز مصادر التعلم / LRC","البحث العلمي والابتكار / Research & Innovation","الإرشاد الأكاديمي والمهني / Guidance","الشؤون الأكاديمية / Academic Affairs","الشؤون الإدارية / Administrative Affairs","جميع الأقسام / All Departments"],
itemType:["مستهلكات / Consumables","أصول / Assets"],
priority:["عالية / High","متوسطة / Medium","منخفضة / Low"],
status:["مسودة / Draft","مرفوع للاعتماد / Submitted","معتمد / Approved","مرفوض / Rejected","طلب عروض أسعار / RFQ","تم الشراء / Purchased","تم الاستلام / Received"],
unit:["قطعة / Piece","طقم / Set","علبة / Box","عبوة / Pack","كرتون / Carton","لفة / Roll","كيلوجرام / kg","لتر / L","متر / m","رخصة / License","Kit","طالب / Student","معلم / Teacher"],
subReq:["اشتراك جديد / New","تجديد / Renewal"],

subCat:["منصة تعليمية للطلاب / Student Platform","أداة تدريس للمعلمين / Teaching Tool","تقييم واختبارات / Assessment","تطوير مهني / Professional Development","برمجة وتقنية / Coding & Tech","إدارة مدرسية / School Management","الموقع والخدمات الرقمية / Website & Digital Services"],

lang:["العربية / Arabic","الإنجليزية / English","ثنائي اللغة / Bilingual"],
aud:["الطلاب / Students","المعلمون / Teachers","الطلاب والمعلمون / Students & Teachers","الإداريون / Staff"],
needType:["أدوات ومستلزمات / Tools & Supplies","وسائل تعليمية / Teaching Aids","أثاث / Furniture","قرطاسية / Stationery","خدمات / Services","الأنشطة اللامنهجية المدفوعة / Paid Extracurricular Activities","أخرى / Other"],
grade:["الصف السابع / G7","الصف الثامن / G8","الصف التاسع / G9","الصف العاشر / G10","الصف الحادي عشر / G11","الصف الثاني عشر / G12","جميع الصفوف / All Grades"],
techCat:["حاسوب محمول / Laptop","حاسوب مكتبي / Desktop","جهاز لوحي / Tablet","شاشة تفاعلية / Interactive Display","جهاز عرض / Projector","طابعة أو ماسح / Printer-Scanner","شبكات وخوادم / Network & Servers","برمجيات وتراخيص / Software & Licenses","صوتيات ومؤتمرات الفيديو / Audio & Video Conferencing","تصوير وإنتاج إعلامي / Photography & Media","أنظمة أمنية وحضور / Security & Attendance","اتصالات / Communications","ملحقات / Accessories","أخرى / Other"],
techReq:["جديد / New","استبدال / Replacement","ترقية / Upgrade","صيانة / Maintenance"],
techItems:["أجهزة كمبيوتر محمولة / Laptops","أجهزة كمبيوتر محمولة للمسابقات الدولية (WorldSkills) / Laptops for International Competitions","أجهزة كمبيوتر محمولة Apple لتدريس تكنولوجيا التصميم / Apple Laptops – Design Technology","جهاز كمبيوتر مكتبي / Desktop PC","جهاز كمبيوتر متكامل احترافي – المكتبة الرقمية / Professional All-in-One PC – Digital Library","جهاز لوحي (تابلت) / Tablet","شاشات عرض تفاعلية (ذكية) متنقلة / Mobile Interactive Displays","أجهزة عرض تفاعلية / Interactive Projectors","شاشات تلفزيون / TV Screens","جهاز عرض بصري / Visualizer","نظام مؤتمرات الفيديو / Video Conferencing","نظام صوت احترافي سقفي / Professional In-Ceiling Audio System","طابعة بطاقات / ID Card Printer","طابعة Plotter / Plotter Printer","طابعة HP / HP Printer","آلة تصوير HP / HP Copier","أجهزة مسح ضوئي سريعة / High-Speed Scanners","قارئ باركود / Barcode Readers","أجهزة بصمة للموظفين / Staff Biometric Devices","نظام كاميرات مراقبة / Indoor & Outdoor CCTV System","هواتف أرضية / Landline Phones","كاميرا Sony α7 IV / Camera Body","عدسة Sony FE 24-70mm f/2.8 GM / Lens","عدسة Sony FE 50mm f/1.8 / Lens","عدسة Sony FE 85mm f/1.8 / Lens","نظام ميكروفون لاسلكي RØDE Wireless GO II / Wireless Microphone System","حامل Manfrotto ONE Carbon / Carbon Tripod with Fluid Head","بطاقات ذاكرة SDXC V90 أو CFexpress / Memory Cards","حامل فيديو احترافي Manfrotto / Professional Video Tripod","جهاز تلقين / Teleprompter","بطاريات Sony NP-FZ100 مع شاحن / Extra Batteries + Dual Charger","إضاءة Aputure LS C300d II / Professional Lighting","حامل إضاءة C-Stand / Light Stand","فلاش للكاميرا / Detachable Camera Flash","جهاز إرسال فيديو لاسلكي / Wireless Video Transmitter"],
labs:["مختبر الطائرات المسيّرة / Drones Lab","مختبر الفيزياء التطبيقية / Applied Physics Lab","مختبر المحاكاة الطبية / Medical Simulation Lab","مختبر التحليل الكيميائي / Chemical Analysis Lab","مختبر التصميم الهندسي / Engineering Design Lab","مختبر الاتصالات / Communication Lab","مختبر التصنيع الرقمي / Fab Lab","مختبر الشبكات / Networking Lab","مختبر علوم الفضاء / Space Science Lab","مختبر علوم الحاسوب / CS Lab","مختبر اللغات / Languages Lab","مختبر الواقع المعزز / AR Lab","مختبر الواقع الافتراضي / VR Lab","مختبر STEM / STEM Lab","مختبر الطب الحيوي / BioMed Lab","مختبر الروبوتات / Robotics Lab","مختبر الطاقة / Energy Lab","مختبر الأحياء / Biology Lab","مختبر الكيمياء / Chemistry Lab","مختبر الفيزياء / Physics Lab"]
};
// Labels/list values are "Arabic / English" (or "Arabic | English" when the text contains "/"). Data keeps the bilingual value.
// Field: [key, label, type(t/n/d/s/ta/dl), list, required]
const DEPT=["dept","القسم / Department","s","dept",1], QTY=["qty","الكمية / Qty","n","",1], PRICE=["price","سعر الوحدة (ر.ق) / Unit Price (QAR)","n"], UNIT=["unit","الوحدة / Unit","s","unit"];
const SPEC=["spec","المواصفات / Specifications","ta"], BRAND=["brand","البراند المطلوب / Required Brand","t"], URLF=["url","الرابط / المورد المقترح | URL / Suggested Supplier","t"];
const TAIL=[["priority","الأولوية / Priority","s","priority",1],["status","الحالة / Status","s","status",1],["by","مقدم الطلب / Requested by","t","",1],["notes","ملاحظات / Notes","ta"],["supplier","المورد / Supplier","t"]];
const C={
subs:{title:"عضويات-اشتراكات-اختبارات | Memberships, Subscriptions & Tests",f:[DEPT,["item","اسم المنصة / الاشتراك | Platform / Subscription","t","",1],["desc","الوصف والغرض / Description & Purpose","ta"],["subCat","فئة الاشتراك / Category","s","subCat"],["target","الفئة المستهدفة / الصف | Target Users / Grade","t"],["users","عدد المستخدمين / التراخيص | Users / Licenses","n"],["subReq","نوع الطلب / Request Type","s","subReq"],["period","مدة الاشتراك / Period","s","period"],["start","تاريخ البدء / Start Date","d"],["end","تاريخ الانتهاء / End Date","d"],["cost","التكلفة التقديرية (ر.ق) / Est. Cost (QAR)","n"],["url","الرابط / URL","t"],...TAIL]},
lrc:{title:"مصادر التعلم | Learning Resources",f:[DEPT,["reason","سبب الشراء / Reason for Purchase","s","reason"],["resType","نوع المصدر / Resource Type","s","resType"],["item","العنوان / Title","t","",1],["author","المؤلف / Author","t"],["publisher","الناشر / Publisher","t"],["spec","ISBN / الرابط | ISBN / URL","t"],["lang","اللغة / Language","s","lang"],["aud","الفئة المستهدفة / Audience","s","aud"],["qty","عدد النسخ / Copies","n","",1],PRICE,...TAIL]},
books:{title:"الكتب الدراسية | Textbooks",f:[DEPT,["grade","المرحلة الدراسية / Grade","s","grade",1],["item","الكتاب المطلوب / Required Book","t","",1],["spec","ISBN","t"],["publisher","الناشر / Publisher","t"],QTY,["price","تكلفة الوحدة التقديرية (ر.ق) / Est. Unit Cost (QAR)","n"],["status","الحالة / Status","s","status",1],["supplier","المورد / Supplier","t"]]},
tech:{title:"الاحتياجات التكنولوجية | Technology Needs",f:[["dept","القسم / الجهة الطالبة | Department / Unit","s","dept",1],["techCat","فئة التجهيز / Equipment Category","s","techCat"],["techReq","نوع الطلب / Request Type","s","techReq"],["item","اسم الصنف / Item","dl","techItems",1],SPEC,["purpose","الغرض من الشراء / Purpose","t"],BRAND,["location","موقع الاستخدام / Location","t"],QTY,PRICE,...TAIL]},
dept:{title:"احتياجات الأقسام | Department Needs",f:[DEPT,["needType","نوع الاحتياج / Need Type","s","needType"],["item","اسم الصنف / Item","t","",1],SPEC,["purpose","الغرض / المبرر | Purpose / Justification","t"],UNIT,QTY,PRICE,["reqBy","الموعد المطلوب / Required By","d"],...TAIL]},
labs:{title:"المختبرات | Labs",f:[["lab","المختبر / Lab","s","labs",1],["itemType","نوع البند / Item Type","s","itemType",1],["item","اسم الصنف / Item","t","",1],SPEC,BRAND,URLF,UNIT,QTY,PRICE,...TAIL]},
research:{title:"البحث العلمي | Scientific Research",f:[["itemType","نوع البند / Item Type","s","itemType",1],["item","اسم الصنف / Item","t","",1],SPEC,["purpose","الغرض من الشراء / Purpose","t"],BRAND,URLF,UNIT,QTY,PRICE,...TAIL]}
};
// Fields kept after "Save & Add" so the next item is faster
const STICKY=["lab","dept","priority","status","itemType","unit"];

// ===== small helpers =====
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
 set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},
 del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let lang=ls.get("qstss_lang")==="en"?"en":"ar";
const T=(a,e)=>lang==="ar"?a:e;
const AR=/[؀-ۿ]/;
function tr(s){if(s==null)return "";s=String(s);
 if(s.includes(" | ")){const i=s.indexOf(" | ");return lang==="ar"?s.slice(0,i):s.slice(i+3);}
 if(!s.includes(" / "))return s;
 const p=s.split(" / "),a=p.filter(x=>AR.test(x)),e=p.filter(x=>!AR.test(x));
 return a.length&&e.length?(lang==="ar"?a:e).join(" / "):s;}
const SN=id=>{const s=SCHOOLS.find(x=>x.id===id);return s?T(s.ar,s.en):"";};
const fmt=n=>(+n||0).toLocaleString("en-US")+" "+T("ر.ق","QAR");
const total=(k,r)=>k==="subs"?(+r.cost||0):(+r.qty||0)*(+r.price||0);
const hasPrice=(k,r)=>k==="subs"?+r.cost>0:+r.price>0;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
// table cell text: links are shown short (site name only) and open in a new tab; the full link is kept in the data and exports
const cell=v=>esc(v).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener" title="${u}" dir="ltr" style="white-space:nowrap">🔗 ${u.replace(/^https?:\/\/(www\.)?/,"").split(/[\/?#]/)[0].slice(0,30)}</a>`);
const jsq=s=>String(s??"").replace(/[^\w|.-]/g,"");
const days=d=>d?Math.ceil((new Date(d)-new Date())/864e5):"";
const shown=(f,v)=>f[2]==="s"?tr(v):(v??"");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
let idn=0;const newId=()=>Date.now().toString(36)+(idn++).toString(36)+Math.random().toString(36).slice(2,7);
const nrm=s=>String(s??"").toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\p{L}\p{N}]+/gu," ").trim();
const grpKey=k=>k==="labs"?"lab":C[k].f.some(f=>f[0]==="dept")?"dept":null;
function toast(m,err){const t=document.getElementById("toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",err?7000:2500);}

// ===== data: shared Google Sheet (REMOTE) or this browser =====
const localKey=id=>KEY+":"+id;
function normData(d){d=d&&typeof d==="object"?d:{};for(const k in C)d[k]=Array.isArray(d[k])?d[k]:[];d._ignored=Array.isArray(d._ignored)?d._ignored:[];return d;}
function loadLocal(id){let d={};try{d=JSON.parse(ls.get(localKey(id))||"{}")}catch(e){}return normData(d);}
function saveLocal(id,d){if(!ls.set(localKey(id),JSON.stringify(d)))throw new Error(T("المتصفح لا يسمح بالحفظ","This browser blocked saving"));}
const local={
 async list(){return loadLocal(school);},
 async save(cat,recs){const d=loadLocal(school);for(const r of recs){const i=d[cat].findIndex(x=>x.id===r.id);if(i>=0)d[cat][i]=r;else d[cat].push(r);}saveLocal(school,d);return d;},
 async del(cat,ids){const d=loadLocal(school);d[cat]=d[cat].filter(x=>!ids.includes(x.id));saveLocal(school,d);return d;},
 async ignore(cat,key){const d=loadLocal(school);if(!d._ignored.includes(key))d._ignored.push(key);saveLocal(school,d);return d;}};
const remote={
 async call(p){const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({...p,school})});
  if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||"Server error");return normData(j.data);},
 list(){return this.call({action:"list"})},
 save(cat,recs){return this.call({action:"save",cat,records:recs})},
 del(cat,ids){return this.call({action:"delete",cat,ids})},
 ignore(cat,key){return this.call({action:"ignore",key})}};
const BE=REMOTE?remote:local;

// ===== state =====
let school=SCHOOLS.some(s=>s.id===ls.get("qstss_school"))?ls.get("qstss_school"):null;
let DB=null, IGN=new Set(), view="pick", editId=null, rfqSrc="tech", dirty=false, dupOpen=null, IMP=null;
let loadErr="", syncing=false, busyN=0, ver=0, lastSync=null;
const flt={};
let sticky={};try{sticky=JSON.parse(ls.get("qstss_sticky")||"{}")||{}}catch(e){}

function setData(d){DB=normData(d);IGN=new Set(DB._ignored);lastSync=new Date();if(REMOTE)ls.set("qstss_cache:"+school,JSON.stringify(DB));}
async function run(fn,okMsg){busyN++;header();ver++;
 try{setData(await fn());loadErr="";if(okMsg)toast(okMsg);return true;}
 catch(e){toast(T("لم يتم الحفظ: ","Not saved: ")+e.message,true);return false;}

const PROXIES=[u=>["https://r.jina.ai/"+u,{headers:{"X-Return-Format":"html"}}],u=>["https://corsproxy.io/?url="+encodeURIComponent(u)],u=>["https://api.allorigins.win/raw?url="+encodeURIComponent(u)]];

 const nodes=[],walk=x=>{if(!x||typeof x!=="object")return;if(Array.isArray(x)){x.forEach(walk);return;}nodes.push(x);walk(x["@graph"]);walk(x.mainEntity);};
 d.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{walk(JSON.parse(s.textContent));}catch(e){}});
 const p=nodes.find(x=>[].concat(x["@type"]||[]).some(t=>/^(Product|ProductGroup|IndividualProduct|Book|SoftwareApplication)$/i.test(t)));
 if(p){o.name=str(p.name);o.spec=str(p.description);o.brand=str(p.brand&&(p.brand.name||p.brand));
  const props=[].concat(p.additionalProperty||[]).filter(a=>a&&a.name&&a.value!=null).map(a=>`${str(a.name)}: ${str(a.value)}`);
  if(props.length)o.spec=[o.spec,props.join("\n")].filter(Boolean).join("\n");
  let of=[].concat(p.offers||(([].concat(p.hasVariant||[])[0]||{}).offers)||[])[0];
  if(of){if(of.price==null&&of.lowPrice==null&&of.offers)of=[].concat(of.offers)[0]||of;
   const ps=[].concat(of.priceSpecification||[])[0]||{};
   o.price=numOf(of.price??of.lowPrice??ps.price);o.cur=str(of.priceCurrency||ps.priceCurrency);}}
 o.name=o.name||meta("og:title","twitter:title")||txt("#productTitle")||txt("h1")||str(d.title);

  o.spec=li.length?li.map(x=>"• "+x).join("\n"):meta("og:description","description","twitter:description");}

 if(!o.price){const e=[...d.querySelectorAll('.a-price .a-offscreen,[itemprop="price"],[data-price],.price,[class*="price" i]')].find(e=>/\d/.test(e.textContent)&&e.textContent.trim().length<40);
  if(e){o.price=numOf(e.textContent);o.cur=o.cur||curOf(e.textContent);}}

function rfq(){const srcs=[["tech",C.tech.title],["books",C.books.title],["research",C.research.title],["dept",C.dept.title],...L.labs.map(l=>["lab:"+l,l])];
 if(!srcs.some(s=>s[0]===rfqSrc)) rfqSrc="tech";
 const items=(rfqSrc.startsWith("lab:")?DB.labs.filter(x=>x.lab===rfqSrc.slice(4)):DB[rfqSrc]).filter(x=>x.status===L.status[4]);
 return `<div class="card"><div class="bar noprint"><label>${T("مصدر الطلب","Source")}<select onchange="rfqSrc=this.value;render()">${srcs.map(([v,t])=>`<option value="${esc(v)}" ${v===rfqSrc?"selected":""}>${esc(tr(t))}</option>`).join("")}</select></label><button class="btn" onclick="print()">${T("طباعة","Print")}</button></div>
 <h2>${T("طلب عروض أسعار","Request for Quotation (RFQ)")}</h2>
 <p><b>${esc(SN(school))}</b><br>${T("رقم الطلب","RFQ No.")}: RFQ-${YEAR}-____ — ${T("تاريخ الإصدار","Issue Date")}: ${today()}<br>${T("المصدر","Source")}: <b>${esc(tr(srcs.find(s=>s[0]===rfqSrc)[1]))}</b></p>
 <table><thead><tr><th>${T("م","#")}</th><th>${T("الصنف","Item")}</th><th>${T("المواصفات","Specifications")}</th><th>${T("الوحدة","Unit")}</th><th>${T("الكمية","Qty")}</th><th>${T("سعر الوحدة (ر.ق)","Unit Price (QAR)")}</th><th>${T("الإجمالي (ر.ق)","Total (QAR)")}</th></tr></thead><tbody>
 ${items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.item)}</td><td>${esc(x.spec)}</td><td>${esc(tr(x.unit))}</td><td>${esc(x.qty)}</td><td></td><td></td></tr>`).join("")||`<tr><td colspan="7">${T('لا توجد بنود بحالة "طلب عروض أسعار"','No items with RFQ status')}</td></tr>`}
 </tbody></table>
 <p>${T("اسم المورد","Supplier")}: ____________ &nbsp; ${T("رقم السجل التجاري","CR No.")}: ________ &nbsp; ${T("شخص التواصل","Contact")}: ________ &nbsp; ${T("التوقيع والختم","Signature & Stamp")}: ________</p></div>`;}

function csv(k){const c=C[k],rows=C[view]===c?filtered(k):DB[k],head=[T("م","#"),...c.f.map(f=>tr(f[1])),T("الإجمالي","Total")];
 const lines=[head,...rows.map((x,i)=>[i+1,...c.f.map(f=>shown(f,x[f[0]])),total(k,x)])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
 dl("﻿"+lines.join("\r\n"),`${school}-${k}.csv`,"text/csv");}
function dl(s,n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove();}
function backup(){dl(JSON.stringify({school,...DB}),`qstss-${school}-backup-${today()}.json`,"application/json");}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=normData(JSON.parse(r.result));}catch(e){toast(T("ملف غير صالح","Invalid file"),true);return;}
 if(d.school&&d.school!==school&&SCHOOLS.some(s=>s.id===d.school)&&!confirm(T(`هذه النسخة تخص ${SN(d.school)}. هل تريد إضافتها إلى ${SN(school)}؟`,`This backup belongs to ${SN(d.school)}. Add it to ${SN(school)} anyway?`)))return;
 const n=Object.keys(C).reduce((s,k)=>s+d[k].length,0);
 if(!confirm(T(`إضافة ${n} بند من النسخة الاحتياطية؟ البنود الموجودة بنفس الرقم ستُحدَّث.`,`Add ${n} items from the backup? Items with the same ID are updated.`)))return;
 for(const k in C){if(d[k].length&&!await run(()=>BE.save(k,d[k].map(x=>({...x,id:x.id||newId()})))))return;}
 toast(T("تمت الاستعادة ✓","Restored ✓"));go("dash");};r.readAsText(f);}
function localItems(){const out={};let n=0;for(const key of [localKey(school),KEY]){const raw=ls.get(key);if(!raw)continue;let d;try{d=normData(JSON.parse(raw));}catch(e){continue;}for(const k in C){if(!d[k].length)continue;(out[k]=out[k]||[]).push(...d[k]);n+=d[k].length;}}return {out,n};}
async function uploadLocal(){const {out,n}=localItems();if(!n||!confirm(T(`رفع ${n} بند محفوظ في هذا المتصفح إلى الجدول المشترك لـ ${SN(school)}؟`,`Upload ${n} items saved in this browser to the shared sheet for ${SN(school)}?`)))return;
 for(const k in out)if(!await run(()=>BE.save(k,out[k])))return;ls.del(localKey(school));ls.del(KEY);toast(T("تم الرفع ✓","Uploaded ✓"));go("dash");}
async function moveLegacy(){let d={};try{d=normData(JSON.parse(ls.get(KEY)||"{}"))}catch(e){d=normData()}
 if(!confirm(T(`نقل البيانات السابقة إلى ${SN(school)}؟`,`Move the earlier data into ${SN(school)}?`)))return;
 for(const k in C)if(d[k].length&&!await run(()=>BE.save(k,d[k])))return;ls.del(KEY);go("dash");}
function clearAll(){if(confirm(T(`حذف جميع بيانات ${SN(school)} من هذا المتصفح؟`,`Delete ALL data for ${SN(school)} from this browser?`))){ls.del(localKey(school));setData(loadLocal(school));go("dash");}}
function data(){const li=REMOTE?localItems():{n:0},legacy=!REMOTE&&ls.get(KEY);
 return `<div class="card"><h2>${T("البيانات","Data")} — ${esc(SN(school))}</h2>
 <p>${REMOTE?T("تُحفظ البيانات في جدول Google المشترك، ويراها جميع الموظفين. يتم التحديث تلقائيًا كل دقيقة تقريبًا، أو اضغط «تحديث».","Data is saved in the shared Google Sheet and everyone sees it. The site updates about every minute, or press “Refresh”.")+(lastSync?` <span class="muted">${T("آخر تحديث","Last update")}: ${lastSync.toLocaleTimeString()}</span>`:"")
  :T("الموقع غير متصل بجدول مشترك بعد: تُحفظ البيانات في هذا المتصفح فقط ولا يراها الآخرون.","The site isn't connected to a shared sheet yet: data is saved in this browser only and others can't see it.")}</p>
 ${li.n?`<div class="note">${T(`يوجد ${li.n} بند محفوظ في هذا المتصفح فقط من النسخة السابقة.`,`${li.n} items from the earlier version are saved only in this browser.`)} <button class="btn sm" onclick="uploadLocal()">${T("رفعها إلى الجدول المشترك","Upload them to the shared sheet")}</button></div>`:""}
 ${legacy?`<div class="note">${T("توجد بيانات أُدخلت قبل إضافة اختيار المدرسة.","There is data entered before school selection was added.")} <button class="btn sm" onclick="moveLegacy()">${T("نقلها إلى هذه المدرسة","Move it into this school")}</button></div>`:""}
 <h3>Excel</h3><p class="muted">${T("استورد ملف Excel بنفس عناوين الأعمدة (مثل ملف الحصر الأصلي أو القالب). يتم التعرف على كل ورقة وصفحتها تلقائيًا.","Import an Excel file with the same column titles (like the original inventory workbook or the template). Each sheet and its page are recognised automatically.")}</p>
 <div class="bar"><button class="btn" onclick="pickExcel()">${T("استيراد من Excel","Import from Excel")}</button><button class="btn alt" onclick="exportXlsx(true)">${T("تنزيل قالب Excel","Download Excel template")}</button><button class="btn alt" onclick="exportXlsx(false)">${T("تصدير الكل إلى Excel","Export all to Excel")}</button></div>
 <h3>${T("نسخة احتياطية","Backup")}</h3>
 <div class="bar"><button class="btn alt" onclick="backup()">${T("تنزيل نسخة احتياطية","Download backup")}</button>
 <label class="btn alt">${T("استعادة نسخة احتياطية","Restore backup")}<input type="file" accept=".json" hidden onchange="imp(this.files[0]);this.value=''"></label></div>
 <h3>CSV</h3><div class="bar">${Object.keys(C).map(k=>`<button class="btn sm alt" onclick="csv('${k}')">${esc(tr(C[k].title))}</button>`).join("")}</div>
 ${!REMOTE?`<button class="btn sm" style="background:#b00" onclick="clearAll()">${T("مسح كل بيانات هذه المدرسة","Clear all data for this school")}</button>`:""}</div>`;}
function help(){return `<div class="card"><h2>${T("التعليمات","Instructions")}</h2><ol>
 <li>${T("اختر مدرستك أولًا. يمكنك تغييرها من زر «تغيير المدرسة» أعلى الصفحة.","Choose your school first. You can change it with the “Change school” button at the top.")}</li>
 <li>${T("اختر الصفحة المناسبة من الشريط العلوي، وعبّئ الحقول (المعلّمة بـ * إلزامية). يُحسب الإجمالي تلقائيًا.","Pick the right page from the top bar and fill in the fields (* = required). The total is calculated automatically.")}</li>
 <li>${T("للتعبئة السريعة: ألصق رابط المنتج في خانة «تعبئة من الرابط» أعلى النموذج، فيُملأ الاسم والمواصفات والسعر تلقائيًا إن أمكن. راجع البيانات دائمًا وأضف الكمية والخيار المطلوب. بعض المواقع تمنع القراءة الآلية.","Quick fill: paste a product link in “Fill from link” above the form and the name, specifications and price are filled in when possible. Always check them and add the quantity and the option you need. Some sites block automatic reading.")}</li>
 <li>${T(`يمكن إدخال السعر بالدولار: اختر «دولار $» بجانب خانة السعر، فيُحوَّل تلقائيًا إلى الريال (1 دولار = ${USD_RATE} ر.ق) ويُحفظ بالريال.`,`Prices can be entered in USD: choose “USD $” next to the price box and it is converted to QAR automatically (1 USD = ${USD_RATE} QAR) and saved in QAR.`)}</li>
 <li>${T("بعد «حفظ وإضافة» يبقى المختبر/القسم ومقدم الطلب والأولوية ونوع البند والوحدة، فتكتب البند التالي مباشرة.","After “Save & Add”, the lab/department, name, priority, item type and unit stay filled, so you can type the next item straight away.")}</li>
 <li>${T("تُحفظ البنود الجديدة بحالة «مسودة». لتغيير حالة أي بند اختر الحالة من القائمة المنسدلة في عمود «الحالة» بالجدول، وتُحفظ فورًا.","New items are saved as Draft. To change an item's status, pick it from the dropdown in the table's Status column; it is saved immediately.")}</li>
 <li>${T("إذا كان هناك بند مشابه في نفس المختبر/القسم يظهر تنبيه قبل الحفظ. زر «فحص التكرار» يعرض كل البنود المتشابهة لجميع الموظفين؛ احذف المكرر أو اضغط «ليس تكرارًا».","If a similar item exists in the same lab/department you get a warning before saving. “Check duplicates” lists all similar items from all staff; delete the repeat or press “Not a duplicate”.")}</li>
 <li>${T("استخدم الفلاتر فوق الجدول (المختبر، مقدم الطلب، نوع البند، البحث).","Use the filters above the table (lab, person, item type, search).")}</li>
 <li>${T("لإضافة بنود كثيرة: «استيراد من Excel» بملف بنفس عناوين الأعمدة، ثم عدّل البنود في الموقع.","To add many items: “Import from Excel” with a file that has the same column titles, then edit the items on the site.")}</li>
 <li>${T("البنود بحالة «طلب عروض أسعار» تظهر في صفحة RFQ للطباعة.","Items with status “RFQ” appear on the RFQ page, ready to print.")}</li>
 <li>${T("زر English / العربية أعلى الصفحة يبدّل لغة الموقع.","The English / العربية button at the top switches the language.")}</li></ol></div>`;}

if(school)pickSchool(school);else render();
</script>
</body>
</html>
